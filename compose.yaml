services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    env_file:
      - .env
    environment:
      FALKOR_HOST: falkordb
      FALKOR_PORT: "6379"
      # Local FalkorDB runs without authentication in this dev setup.
      FALKOR_USERNAME: ""
      FALKOR_PASSWORD: ""
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    ports:
      # Optional host access for local tools;
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  falkordb_data:
