<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Relay</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" def></script>
</head>
<body>
<div class="banner">Demo data is fictional. Do not enter real personal information.</div>
<div style="padding:8px 16px">
  Company:
  <select id="tenant" onchange="switchTenant()">
    <option value="tenant_acme">Acme Cloud (customer: Maya)</option>
    <option value="tenant_bank">Northbank (customer: Raj)</option>
  </select>
</div>
<div class="wrap">
  <div class="col">
    <div class="card" style="flex:1;display:flex;flex-direction:column">
      <h3>Chat</h3>
      <div id="log"></div>
      <div><input type="text" id="box" placeholder="Type a message..." onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">Send</button></div>
    </div>
  </div>
  <div class="col">
    <div class="card" style="flex:1"><h3>Evidence: graph queries behind the last reply</h3><div id="trace">Send a message to see them.</div></div>
    <div class="card" style="flex:1"><h3>Memory in the graph (facts with time)</h3><div id="facts"></div></div>
  </div>
</div>
</body>
</html>
